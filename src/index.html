<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuphead: Block Edition</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: radial-gradient(ellipse at center, #1a0805 0%, #080808 100%);
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; overflow: hidden; user-select: none;
            font-family: 'Courier New', Courier, monospace;
        }
        #wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; }
        canvas {
            display: block; width: 900px; height: 450px;
            border: 4px solid #d35400;
            box-shadow: 0 0 50px rgba(211,84,0,0.55), 0 0 100px rgba(211,84,0,0.18);
            image-rendering: pixelated; image-rendering: crisp-edges;
        }
        #bar {
            display: flex; align-items: center; gap: 14px;
            color: #4a4a4a; font-size: 11px; letter-spacing: 0.5px;
        }
        #fsBtn {
            background: transparent; border: 1px solid #444; color: #666;
            font: 11px 'Courier New'; padding: 3px 10px; cursor: pointer;
            border-radius: 3px; letter-spacing: 0.5px; transition: all 0.15s;
            white-space: nowrap;
        }
        #fsBtn:hover { border-color: #d35400; color: #d35400; }

        /* Fullscreen mode */
        #wrap:fullscreen, #wrap:-webkit-full-screen, #wrap:-moz-full-screen {
            background: #000; display: flex; justify-content: center;
            align-items: center; width: 100vw; height: 100vh;
        }
        #wrap:fullscreen canvas, #wrap:-webkit-full-screen canvas, #wrap:-moz-full-screen canvas {
            width:  min(100vw, 200vh);
            height: min(50vw,  100vh);
            border: none; box-shadow: none;
        }
        #wrap:fullscreen #bar, #wrap:-webkit-full-screen #bar, #wrap:-moz-full-screen #bar {
            display: none;
        }
    </style>
</head>
<body>
<div id="wrap">
    <canvas id="gameCanvas"></canvas>
    <div id="bar">
        <span>WASD/↑↓←→ Mover · ESPACIO Saltar · CLICK Disparar · SHIFT Dash · F Arma · P/ESC Pausa · R Menú</span>
        <button id="fsBtn" onclick="toggleFullscreen()">⛶ PANTALLA COMPLETA</button>
    </div>
</div>
<script>
// ─────────────────────────────────────────────
//  SETUP
// ─────────────────────────────────────────────
const canvas = document.getElementById("gameCanvas");
const ctx    = canvas.getContext("2d");
const W = 900, H = 450;

(function setupHD() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width  = W * dpr;
    canvas.height = H * dpr;
    ctx.scale(dpr, dpr);
    ctx.imageSmoothingEnabled = false;
})();

// ─────────────────────────────────────────────
//  FULLSCREEN
// ─────────────────────────────────────────────
function toggleFullscreen() {
    const wrap = document.getElementById('wrap');
    if (!document.fullscreenElement) {
        (wrap.requestFullscreen || wrap.webkitRequestFullscreen || wrap.mozRequestFullScreen).call(wrap);
    } else {
        (document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen).call(document);
    }
}
document.addEventListener('fullscreenchange', () => {
    document.getElementById('fsBtn').textContent =
        document.fullscreenElement ? '⊠ SALIR PANTALLA COMPLETA' : '⛶ PANTALLA COMPLETA';
});

// ─────────────────────────────────────────────
//  AUDIO
// ─────────────────────────────────────────────
let audioCtx = null;
function startAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playSound(type) {
    startAudio(); if (!audioCtx) return;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    const t = audioCtx.currentTime;
    switch (type) {
        case 'shot1':     osc.type='triangle'; osc.frequency.setValueAtTime(600,t); osc.frequency.exponentialRampToValueAtTime(150,t+0.1); gain.gain.setValueAtTime(0.15,t); gain.gain.exponentialRampToValueAtTime(0.01,t+0.1); osc.start(t); osc.stop(t+0.1); break;
        case 'shot2':     osc.type='sawtooth'; osc.frequency.setValueAtTime(250,t); osc.frequency.linearRampToValueAtTime(80,t+0.15); gain.gain.setValueAtTime(0.2,t); gain.gain.exponentialRampToValueAtTime(0.01,t+0.15); osc.start(t); osc.stop(t+0.15); break;
        case 'bossHit':   osc.type='square'; osc.frequency.setValueAtTime(120,t); osc.frequency.linearRampToValueAtTime(40,t+0.05); gain.gain.setValueAtTime(0.1,t); gain.gain.exponentialRampToValueAtTime(0.01,t+0.05); osc.start(t); osc.stop(t+0.05); break;
        case 'enemyDie':  osc.type='sawtooth'; osc.frequency.setValueAtTime(180,t); osc.frequency.exponentialRampToValueAtTime(30,t+0.2); gain.gain.setValueAtTime(0.3,t); gain.gain.exponentialRampToValueAtTime(0.01,t+0.2); osc.start(t); osc.stop(t+0.2); break;
        case 'playerHit': osc.type='sawtooth'; osc.frequency.setValueAtTime(150,t); osc.frequency.linearRampToValueAtTime(300,t+0.1); osc.frequency.linearRampToValueAtTime(100,t+0.3); gain.gain.setValueAtTime(0.4,t); gain.gain.exponentialRampToValueAtTime(0.01,t+0.3); osc.start(t); osc.stop(t+0.3); break;
        case 'menuClick': osc.type='sine'; osc.frequency.setValueAtTime(400,t); osc.frequency.setValueAtTime(600,t+0.08); gain.gain.setValueAtTime(0.2,t); gain.gain.exponentialRampToValueAtTime(0.01,t+0.15); osc.start(t); osc.stop(t+0.15); break;
        case 'levelUp':   osc.type='sine'; osc.frequency.setValueAtTime(440,t); osc.frequency.setValueAtTime(550,t+0.12); osc.frequency.setValueAtTime(660,t+0.24); gain.gain.setValueAtTime(0.3,t); gain.gain.exponentialRampToValueAtTime(0.01,t+0.45); osc.start(t); osc.stop(t+0.45); break;
        case 'homing':    osc.type='sawtooth'; osc.frequency.setValueAtTime(80,t); osc.frequency.linearRampToValueAtTime(200,t+0.2); gain.gain.setValueAtTime(0.25,t); gain.gain.exponentialRampToValueAtTime(0.01,t+0.2); osc.start(t); osc.stop(t+0.2); break;
    }
}

// ─────────────────────────────────────────────
//  STATE
// ─────────────────────────────────────────────
let gameState    = "MENU";
let currentLevel = 1;
const MAX_LEVELS = 4;
let score    = 0;
let frames   = 0;
let lastShot = 0;
let mouseDown = false;
let enemyTimer;

let shakeAmt = 0, shakeFrames = 0;
function triggerShake(amt, dur) { shakeAmt = amt; shakeFrames = dur; }

const mouse = { x: 0, y: 0 };

const menuParts = Array.from({ length: 45 }, () => ({
    x: Math.random() * W, y: Math.random() * H,
    vx: (Math.random() - 0.5) * 0.4, vy: -(Math.random() * 0.7 + 0.2),
    r: Math.random() * 2.5 + 0.8, alpha: Math.random(),
}));

// ─────────────────────────────────────────────
//  ENTITIES
// ─────────────────────────────────────────────
const player = {
    x: 80, y: 320, w: 45, h: 75, hBase: 75,
    vy: 0, speed: 5, gravity: 0.6, jumpForce: -13,
    jumping: false, crouching: false,
    hpMax: 3, hp: 3, invincible: false, invincibleUntil: 0,
    dashing: false, dashCooldown: false, dashEnd: 0, dashCooldownEnd: 0, dashDir: 1,
    weapon: 1,
};

const boss = {
    x: 680, y: 110, w: 160, h: 300, hpMax: 80, hp: 80,
    name: "KING BLOCK", color: "#2c3e50", phase: 1, dy: 1, vy: 3,
    lastAttack: 0, attackRate: 1400, attackCount: 0,
};

const bullets     = [];
const bossBullets = [];
const enemies     = [];
const particles   = [];
let shotFlash = { x: 0, y: 0, active: false, timer: 0 };

// ─────────────────────────────────────────────
//  LEVEL CONFIGS
// ─────────────────────────────────────────────
const LEVEL_CONFIGS = {
    1: { name: "KING BLOCK",    color: "#2c3e50", hpMax: 80,  attackRate: 1400, vy: 3, w: 160, h: 300 },
    2: { name: "CAPTAIN SLIME", color: "#27ae60", hpMax: 100, attackRate: 1200, vy: 4, w: 180, h: 180 },
    3: { name: "NEON PHANTOM",  color: "#8e44ad", hpMax: 120, attackRate: 900,  vy: 6, w: 160, h: 240 },
    4: { name: "CRIMSON DEVIL", color: "#7d0000", hpMax: 160, attackRate: 700,  vy: 4, w: 140, h: 220 },
};

function loadLevel(n) {
    bullets.length = 0; bossBullets.length = 0; enemies.length = 0; particles.length = 0;
    player.x = 80; player.crouching = false; player.h = player.hBase; player.y = 320;
    player.hp = player.hpMax; player.invincible = false; player.dashing = false; player.dashCooldown = false;
    const cfg = LEVEL_CONFIGS[n];
    boss.phase = 1; boss.dy = 1; boss.lastAttack = 0; boss.attackCount = 0;
    boss.x = n === 4 ? 690 : 680;
    boss.y = n === 4 ? 80  : 110;
    Object.assign(boss, cfg, { hp: cfg.hpMax });
}

// ─────────────────────────────────────────────
//  PARTICLES
// ─────────────────────────────────────────────
function spawnParticles(x, y, color, count = 12) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x, y, r: Math.random() * 4 + 2,
            vx: (Math.random() - 0.5) * 8, vy: (Math.random() - 0.8) * 8,
            color, alpha: 1, decay: Math.random() * 0.03 + 0.02,
        });
    }
}

// ─────────────────────────────────────────────
//  UI RECTS
// ─────────────────────────────────────────────
const MENU_BTNS = [
    { id: 1, label: "NIVEL 1 — KING BLOCK",    badge: "NORMAL",    bColor: "#27ae60", x: 250, y: 148, w: 400, h: 48 },
    { id: 2, label: "NIVEL 2 — CAPTAIN SLIME", badge: "DIFÍCIL",   bColor: "#e67e22", x: 250, y: 208, w: 400, h: 48 },
    { id: 3, label: "NIVEL 3 — NEON PHANTOM",  badge: "EXTREMO",   bColor: "#8e44ad", x: 250, y: 268, w: 400, h: 48 },
    { id: 4, label: "NIVEL 4 — CRIMSON DEVIL", badge: "PESADILLA", bColor: "#c0392b", x: 250, y: 328, w: 400, h: 48 },
];

const FS_BTN = { x: W - 38, y: 10, w: 26, h: 24 };

function getPauseBtns() {
    const bw = 280, bh = 46, gap = 12;
    return [
        { id: 'resume',  label: "▶  REANUDAR" },
        { id: 'restart', label: "↺  REINICIAR NIVEL" },
        { id: 'menu',    label: "⌂  MENÚ PRINCIPAL" },
    ].map((b, i) => ({ ...b, x: W/2 - bw/2, y: H/2 + 10 + i*(bh+gap), w: bw, h: bh }));
}

function getDeadBtns() {
    const bw = 260, bh = 46, gap = 12;
    return [
        { id: 'retry', label: "↺  REINTENTAR" },
        { id: 'menu',  label: "⌂  MENÚ PRINCIPAL" },
    ].map((b, i) => ({ ...b, x: W/2 - bw/2, y: H/2 + 55 + i*(bh+gap), w: bw, h: bh }));
}

function hits(btn, mx, my) {
    return mx >= btn.x && mx <= btn.x + btn.w && my >= btn.y && my <= btn.y + btn.h;
}

// ─────────────────────────────────────────────
//  INPUT
// ─────────────────────────────────────────────
const keys = {};

canvas.addEventListener("mousemove", e => {
    const r = canvas.getBoundingClientRect();
    mouse.x = (e.clientX - r.left) * (W / r.width);
    mouse.y = (e.clientY - r.top)  * (H / r.height);
    updateCursor();
});

function updateCursor() {
    if (hits(FS_BTN, mouse.x, mouse.y)) { canvas.style.cursor = "pointer"; return; }
    if (gameState === "PLAYING") { canvas.style.cursor = "crosshair"; return; }
    let btnList = [];
    if (gameState === "MENU")   btnList = MENU_BTNS;
    if (gameState === "PAUSED") btnList = getPauseBtns();
    if (gameState === "DEAD")   btnList = getDeadBtns();
    canvas.style.cursor = btnList.some(b => hits(b, mouse.x, mouse.y)) ? "pointer" : "default";
}

window.addEventListener("keydown", e => {
    keys[e.code] = true; startAudio();
    if (gameState === "PLAYING") {
        if (e.code === "KeyP" || e.code === "Escape") { gameState = "PAUSED"; updateCursor(); }
        if (e.code === "KeyF") { player.weapon = player.weapon === 1 ? 2 : 1; playSound('menuClick'); }
        if ((e.code === "ShiftLeft" || e.code === "ShiftRight") && !player.dashing && !player.dashCooldown && !player.crouching) {
            player.dashing = true; player.invincible = true;
            player.dashEnd = Date.now() + 200; player.invincibleUntil = Date.now() + 200;
            player.dashDir = (keys["ArrowLeft"] || keys["KeyA"]) ? -1 : 1;
            spawnParticles(player.x + player.w/2, player.y + player.h - 10, "#ffffff", 8);
        }
    } else if (gameState === "PAUSED") {
        if (e.code === "KeyP" || e.code === "Escape") { gameState = "PLAYING"; updateCursor(); }
    }
    if (e.code === "KeyR") goToMenu();
});
window.addEventListener("keyup", e => { keys[e.code] = false; });

window.addEventListener("mousedown", e => {
    if (e.button !== 0) return;
    startAudio();
    const mx = mouse.x, my = mouse.y;

    if (hits(FS_BTN, mx, my)) { toggleFullscreen(); return; }

    if (gameState === "MENU") {
        for (const btn of MENU_BTNS) {
            if (hits(btn, mx, my)) { playSound('menuClick'); startGame(btn.id); }
        }
    } else if (gameState === "PAUSED") {
        for (const btn of getPauseBtns()) {
            if (hits(btn, mx, my)) {
                playSound('menuClick');
                if (btn.id === 'resume')  { gameState = "PLAYING"; updateCursor(); }
                else if (btn.id === 'restart') { clearTimeout(enemyTimer); loadLevel(currentLevel); spawnEnemy(); gameState = "PLAYING"; updateCursor(); }
                else if (btn.id === 'menu')    goToMenu();
            }
        }
    } else if (gameState === "DEAD") {
        for (const btn of getDeadBtns()) {
            if (hits(btn, mx, my)) {
                playSound('menuClick');
                if (btn.id === 'retry') { clearTimeout(enemyTimer); loadLevel(currentLevel); spawnEnemy(); gameState = "PLAYING"; updateCursor(); }
                else if (btn.id === 'menu') goToMenu();
            }
        }
    } else if (gameState === "VICTORY") {
        goToMenu();
    } else if (gameState === "PLAYING") {
        mouseDown = true;
    }
});
window.addEventListener("mouseup", e => { if (e.button === 0) mouseDown = false; });

function startGame(n) {
    currentLevel = n; score = 0; mouseDown = false;
    clearTimeout(enemyTimer); loadLevel(n); spawnEnemy();
    gameState = "PLAYING"; canvas.style.cursor = "crosshair";
}
function goToMenu() {
    clearTimeout(enemyTimer); gameState = "MENU"; mouseDown = false; canvas.style.cursor = "default";
}

// ─────────────────────────────────────────────
//  LEVEL PROGRESSION
// ─────────────────────────────────────────────
function nextLevel() {
    spawnParticles(boss.x + boss.w/2, boss.y + boss.h/2, "#f1c40f", 60);
    if (currentLevel < MAX_LEVELS) {
        playSound('levelUp'); gameState = "TRANSITION"; currentLevel++;
        clearTimeout(enemyTimer);
        setTimeout(() => { clearTimeout(enemyTimer); loadLevel(currentLevel); gameState = "PLAYING"; spawnEnemy(); }, 2500);
    } else {
        gameState = "VICTORY";
    }
}

// ─────────────────────────────────────────────
//  SHOOTING
// ─────────────────────────────────────────────
function shoot() {
    const now = Date.now();
    if (now - lastShot <= (player.weapon === 1 ? 120 : 250)) return;
    lastShot = now;
    const up = keys["ArrowUp"] || keys["KeyW"];
    const bY = player.crouching ? player.y + 15 : player.y + 22;
    shotFlash.x = up ? player.x + player.w/2 : player.x + player.w + 5;
    shotFlash.y = up ? player.y - 10 : bY + 5;
    shotFlash.active = true; shotFlash.timer = 3;
    if (player.weapon === 1) {
        playSound('shot1');
        bullets.push({ type:1, x: up ? player.x+player.w/2-7 : player.x+player.w, y: up ? player.y-15 : bY, w: up?14:24, h: up?24:14, vx: up?0:13, vy: up?-13:0, color:"#00edff", range:9999 });
    } else {
        playSound('shot2');
        for (const [vx, vy] of (up ? [[0,-11],[-4,-10],[4,-10]] : [[11,0],[10,-4],[10,4]])) {
            bullets.push({ type:2, x: up?player.x+player.w/2-8:player.x+player.w, y: up?player.y:bY, w:16, h:16, vx, vy, color:"#f1c40f", range:480 });
        }
    }
}

// ─────────────────────────────────────────────
//  BOSS ATTACKS
// ─────────────────────────────────────────────
function angleToPlayer(fromX, fromY) {
    return Math.atan2(player.y + player.h/2 - fromY, player.x + player.w/2 - fromX);
}

function bossAttack() {
    if (gameState !== "PLAYING") return;
    const now = Date.now();
    if (now - boss.lastAttack <= boss.attackRate) return;
    boss.lastAttack = now;
    boss.attackCount++;

    const mk = (x, y, vx, vy, gy, color, homing = false) =>
        ({ x, y, w: 24, h: 24, vx, vy, gravityY: gy, color, homing });

    if (currentLevel === 1) {
        const p = boss.phase;
        if (p === 1) bossBullets.push(mk(boss.x, boss.y+120, -6, 0, 0, "#e67e22"));
        else { bossBullets.push(mk(boss.x, boss.y+60, -9, 0, 0, "#e74c3c")); bossBullets.push(mk(boss.x, boss.y+200, -9, 0, 0, "#e74c3c")); }
    } else if (currentLevel === 2) {
        const p = boss.phase;
        if (p === 1) bossBullets.push(mk(boss.x+40, boss.y+40, -5, -6, 0.25, "#2ecc71"));
        else { bossBullets.push(mk(boss.x+40, boss.y+40, -7, -8, 0.3, "#27ae60")); bossBullets.push(mk(boss.x, boss.y+60, -5, -7, 0.25, "#1abc9c")); }
    } else if (currentLevel === 3) {
        const p = boss.phase;
        if (p === 1) { bossBullets.push(mk(boss.x, boss.y+120, -8, -2, 0, "#9b59b6")); bossBullets.push(mk(boss.x, boss.y+120, -8, 2, 0, "#9b59b6")); }
        else { bossBullets.push(mk(boss.x, boss.y+100, -11, 0, 0, "#ff4757")); bossBullets.push(mk(boss.x, boss.y+140, -10, -4, 0, "#ff4757")); bossBullets.push(mk(boss.x, boss.y+140, -10, 4, 0, "#ff4757")); }
    } else if (currentLevel === 4) {
        const originX = boss.x, originY = boss.y + boss.h/2;
        const angle = angleToPlayer(originX, originY);
        const spread = boss.phase === 1 ? 3 : 5;
        const halfSpread = (spread - 1) / 2;
        const spreadAmt = boss.phase === 1 ? 0.28 : 0.22;
        const speed = boss.phase === 1 ? 7 : 8.5;
        for (let i = 0; i < spread; i++) {
            const a = angle + (i - halfSpread) * spreadAmt;
            bossBullets.push(mk(originX, originY, Math.cos(a)*speed, Math.sin(a)*speed, 0, boss.phase === 1 ? "#ff5722" : "#ff1744"));
        }
        // Phase 2: every 3rd attack fires a homing fireball
        if (boss.phase === 2 && boss.attackCount % 3 === 0) {
            playSound('homing');
            bossBullets.push(mk(originX, originY, -4, 0, 0, "#ff8c00", true));
        }
    }
}

// ─────────────────────────────────────────────
//  ENEMIES
// ─────────────────────────────────────────────
function spawnEnemy() {
    if (gameState !== "PLAYING") { enemyTimer = setTimeout(spawnEnemy, 800); return; }
    const flying = Math.random() > 0.45;
    const size = Math.random() * 15 + 42;
    enemies.push({
        type: flying ? "flying" : "ground",
        x: boss.x - 20,
        y: flying ? Math.random() * 130 + 50 : H - size - 40,
        w: size, h: size, speed: Math.random() * 3 + 2, phase: Math.random() * 100,
    });
    enemyTimer = setTimeout(spawnEnemy, boss.phase === 1 ? 2300 : 1300);
}

// ─────────────────────────────────────────────
//  COLLISION
// ─────────────────────────────────────────────
function collides(a, b) {
    return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
}

// ─────────────────────────────────────────────
//  UPDATE
// ─────────────────────────────────────────────
function update() {
    if (gameState !== "PLAYING") return;
    frames++;

    if (shakeFrames > 0) { shakeFrames--; shakeAmt *= 0.82; } else shakeAmt = 0;
    if (shotFlash.active && --shotFlash.timer <= 0) shotFlash.active = false;

    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx; p.vy += 0.2; p.y += p.vy; p.alpha -= p.decay;
        if (p.alpha <= 0) particles.splice(i, 1);
    }

    // Crouch
    if ((keys["ArrowDown"] || keys["KeyS"]) && !player.jumping) {
        if (!player.crouching) { player.crouching = true; player.h = Math.round(player.hBase/1.6); player.y += player.hBase - player.h; }
    } else if (player.crouching) { player.y -= player.hBase - player.h; player.crouching = false; player.h = player.hBase; }

    // Dash
    if (player.dashing && Date.now() > player.dashEnd) { player.dashing = false; player.dashCooldown = true; player.dashCooldownEnd = Date.now() + 400; }
    if (player.dashCooldown && Date.now() > player.dashCooldownEnd) player.dashCooldown = false;
    if (player.invincible && Date.now() > player.invincibleUntil && !player.dashing) player.invincible = false;

    if (player.dashing) {
        player.x += 14 * player.dashDir;
        if (frames % 2 === 0) spawnParticles(player.x, player.y + player.h - 15, "rgba(255,255,255,0.4)", 2);
    } else {
        if (!player.crouching) {
            if (keys["ArrowLeft"]  || keys["KeyA"]) player.x -= player.speed;
            if (keys["ArrowRight"] || keys["KeyD"]) player.x += player.speed;
        }
    }

    if ((keys["Space"] || keys["KeyK"]) && !player.jumping && !player.dashing && !player.crouching) {
        player.vy = player.jumpForce; player.jumping = true;
        spawnParticles(player.x + player.w/2, player.y + player.h, "#cbd5e1", 6);
    }
    if (!player.dashing) { player.vy += player.gravity; player.y += player.vy; }

    const floor = H - player.h - 40;
    if (player.y >= floor) { player.y = floor; player.vy = 0; player.jumping = false; }
    if (player.y < 0) player.y = 0;
    player.x = Math.max(0, Math.min(player.x, boss.x - player.w));

    if (mouseDown) shoot();
    bossAttack();

    // Boss movement
    if (currentLevel === 1 && boss.phase === 2) {
        boss.y += boss.vy * boss.dy;
        if (boss.y < 40 || boss.y + boss.h > H - 45) boss.dy *= -1;
    } else if (currentLevel === 2) {
        boss.y += boss.vy * boss.dy;
        if (boss.y < 50 || boss.y + boss.h > H - 45) boss.dy *= -1;
    } else if (currentLevel === 3) {
        boss.y += Math.sin(frames * 0.05) * 4;
        if (boss.phase === 2 && frames % 150 === 0) boss.y = Math.random() * (H - boss.h - 60) + 30;
    } else if (currentLevel === 4) {
        boss.y += Math.sin(frames * 0.06) * 3.5;
        boss.y = Math.max(30, Math.min(boss.y, H - boss.h - 40));
        if (boss.phase === 2 && frames % 200 === 0) {
            boss.y = 40 + Math.random() * (H - boss.h - 80);
            spawnParticles(boss.x + boss.w/2, boss.y + boss.h/2, "#ff4444", 25);
        }
    }

    // Player bullets
    for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.vx; b.y += b.vy;
        if (b.range !== 9999) b.range -= Math.hypot(b.vx, b.vy);
        if (collides(b, boss)) {
            boss.hp -= b.type === 1 ? 1 : 1.1;
            spawnParticles(b.x, b.y, b.color, 5);
            bullets.splice(i, 1); score += 5;
            playSound('bossHit');
            if (boss.hp <= boss.hpMax/2 && boss.phase === 1) {
                boss.phase = 2;
                spawnParticles(boss.x+boss.w/2, boss.y+boss.h/2, "#ff4757", 35);
                boss.color = { 1:"#c0392b", 2:"#16a085", 3:"#d91b5c", 4:"#ff1a00" }[currentLevel];
                boss.attackRate *= 0.6;
            }
            if (boss.hp <= 0) nextLevel();
            continue;
        }
        if (b.x > W || b.y < 0 || b.range <= 0) bullets.splice(i, 1);
    }

    // Boss bullets (with homing)
    for (let i = bossBullets.length - 1; i >= 0; i--) {
        const b = bossBullets[i];
        if (b.homing) {
            const dx = player.x + player.w/2 - (b.x + b.w/2);
            const dy = player.y + player.h/2 - (b.y + b.h/2);
            const dist = Math.hypot(dx, dy);
            if (dist > 5) { b.vx += ((dx/dist)*6 - b.vx) * 0.055; b.vy += ((dy/dist)*6 - b.vy) * 0.055; }
        }
        b.x += b.vx; if (b.gravityY) b.vy += b.gravityY; b.y += b.vy;
        if (collides(b, player) && !player.invincible) {
            player.hp--; player.invincible = true; player.invincibleUntil = Date.now() + 1000;
            spawnParticles(player.x+player.w/2, player.y+player.h/2, "#ff0000", 20);
            bossBullets.splice(i, 1); playSound('playerHit'); triggerShake(7, 14);
            if (player.hp <= 0) { gameState = "DEAD"; updateCursor(); }
            continue;
        }
        if (b.x < -40 || b.x > W+40 || b.y < -40 || b.y > H+40) bossBullets.splice(i, 1);
    }

    // Enemies
    for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        e.x -= e.speed;
        if (e.type === "flying") e.y += Math.sin((frames + e.phase) * 0.08) * 3;
        if (collides(player, e) && !player.invincible) {
            player.hp--; player.invincible = true; player.invincibleUntil = Date.now() + 1000;
            spawnParticles(player.x+player.w/2, player.y+player.h/2, "#ff0000", 20);
            playSound('playerHit'); triggerShake(7, 14);
            if (player.hp <= 0) { gameState = "DEAD"; updateCursor(); }
        }
        for (let j = bullets.length - 1; j >= 0; j--) {
            if (collides(bullets[j], e)) {
                spawnParticles(e.x+e.w/2, e.y+e.h/2, e.type==="flying"?"#2ecc71":"#9b59b6", 20);
                enemies.splice(i, 1); bullets.splice(j, 1); score += 10;
                playSound('enemyDie'); break;
            }
        }
        if (enemies[i] && e.x + e.w < 0) enemies.splice(i, 1);
    }
}

// ─────────────────────────────────────────────
//  DRAW HELPERS
// ─────────────────────────────────────────────
function rr(x, y, w, h, r, fill, stroke, lw) {
    ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
    if (fill)   { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 2; ctx.stroke(); }
}

function drawBtn(btn, hovered) {
    if (hovered) { ctx.shadowBlur = 12; ctx.shadowColor = "#e74c3c"; }
    rr(btn.x, btn.y, btn.w, btn.h, 6, hovered ? "#c0392b" : "#7b241c", hovered ? "#ff6b6b" : "#e74c3c", hovered ? 2.5 : 2);
    ctx.shadowBlur = 0;
    ctx.fillStyle = hovered ? "#fff" : "#ecf0f1";
    ctx.font = "bold 14px 'Courier New'"; ctx.textAlign = "center";
    ctx.fillText(btn.label, btn.x + btn.w/2, btn.y + btn.h/2 + 5);
    ctx.textAlign = "left";
}

// ─────────────────────────────────────────────
//  DRAW PLAYER
// ─────────────────────────────────────────────
function drawPlayer() {
    if (player.invincible && !player.dashing && Math.floor(frames/4) % 2 === 0) return;
    const { x, y, w, h, crouching, dashing, weapon } = player;
    const stretch = dashing ? 15 : 0;
    const up = keys["ArrowUp"] || keys["KeyW"];

    ctx.fillStyle = dashing ? "#fff" : "#f0a500";
    ctx.fillRect(x+2-stretch, y+(crouching?30:60), 18+stretch, crouching?16:15);
    ctx.fillRect(x+22,        y+(crouching?30:60), 18+stretch, crouching?16:15);
    if (!crouching) { ctx.fillStyle="#333"; ctx.fillRect(x+8,y+50,5,10); ctx.fillRect(x+28,y+50,5,10); }

    ctx.fillStyle = "#c0392b";
    ctx.fillRect(x-stretch, y+(crouching?10:30), 42+stretch*2, crouching?24:22);
    if (mouseDown) { ctx.fillStyle=weapon===1?"#00edff":"#f1c40f"; ctx.fillRect(x+38,y+(crouching?15:22),10,10); }

    ctx.fillStyle="#2f3640"; ctx.fillRect(x+3,y+(crouching?2:15),36,5);
    ctx.fillStyle="#1e272e"; ctx.fillRect(x+8,y+(crouching?-10:3),26,crouching?12:12);

    ctx.fillStyle="#fde3a7"; ctx.strokeStyle="#333"; ctx.lineWidth=1.5;
    ctx.fillRect(x+4,y-(crouching?14:3),34,20); ctx.strokeRect(x+4,y-(crouching?14:3),34,20);

    const eyeBase = crouching ? y-14 : y-3;
    ctx.fillStyle="#fff"; ctx.fillRect(x+7,eyeBase+4,10,10); ctx.fillRect(x+21,eyeBase+4,10,10);
    ctx.fillStyle="#1a1a1a";
    ctx.fillRect(x+10,up?eyeBase+4:eyeBase+6,4,7); ctx.fillRect(x+24,up?eyeBase+4:eyeBase+6,4,7);

    if (shotFlash.active) {
        ctx.fillStyle="rgba(255,255,200,0.9)"; ctx.beginPath(); ctx.arc(shotFlash.x,shotFlash.y,13,0,Math.PI*2); ctx.fill();
        ctx.fillStyle="#fff"; ctx.beginPath(); ctx.arc(shotFlash.x,shotFlash.y,6,0,Math.PI*2); ctx.fill();
    }
}

// ─────────────────────────────────────────────
//  DRAW BOSS
// ─────────────────────────────────────────────
function drawBoss() {
    ctx.save();
    const bx=boss.x, by=boss.y, bw=boss.w, bh=boss.h;
    const cx=bx+bw/2, cy=by+bh/2;

    if (currentLevel === 1) {
        const bob = Math.sin(frames*0.1)*5;
        ctx.fillStyle=boss.color; ctx.strokeStyle="#111"; ctx.lineWidth=5;
        ctx.fillRect(bx,by-bob,bw,bh+bob); ctx.strokeRect(bx,by-bob,bw,bh+bob);
        ctx.fillStyle="#f1c40f";
        ctx.beginPath(); ctx.moveTo(bx+20,by-bob); ctx.lineTo(bx+40,by-28-bob); ctx.lineTo(bx+80,by-bob); ctx.lineTo(bx+120,by-28-bob); ctx.lineTo(bx+140,by-bob); ctx.closePath(); ctx.fill();
        ctx.fillStyle="#fff"; ctx.fillRect(bx+25,by+40-bob,40,45); ctx.fillRect(bx+95,by+40-bob,40,45);
        ctx.fillStyle=boss.phase===1?"#c0392b":"#e74c3c"; ctx.fillRect(bx+35,by+50-bob,16,22); ctx.fillRect(bx+105,by+50-bob,16,22);
        ctx.fillStyle="#111"; ctx.fillRect(bx+30,by+115-bob,100,35);
        ctx.fillStyle="#fff"; for(let i=0;i<5;i++){ctx.fillRect(bx+38+i*18,by+115-bob,10,10);ctx.fillRect(bx+38+i*18,by+140-bob,10,10);}

    } else if (currentLevel === 2) {
        const blob = Math.sin(frames*0.15)*9;
        ctx.strokeStyle="#111"; ctx.lineWidth=6; ctx.fillStyle=boss.color;
        ctx.beginPath(); ctx.ellipse(cx,cy,bw/2,bh/2+blob,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
        ctx.fillStyle="rgba(255,255,255,0.2)"; ctx.beginPath(); ctx.ellipse(cx-35,cy-38,24,11,-Math.PI/4,0,Math.PI*2); ctx.fill();
        ctx.strokeStyle="#111"; ctx.lineWidth=4;
        ctx.fillStyle="#fff"; ctx.beginPath(); ctx.arc(cx,cy-12,34,0,Math.PI*2); ctx.fill(); ctx.stroke();
        ctx.fillStyle=boss.phase===1?"#d35400":"#c0392b"; ctx.beginPath(); ctx.arc(cx-8,cy-8,14,0,Math.PI*2); ctx.fill();
        ctx.fillStyle="#000"; ctx.beginPath(); ctx.arc(cx-8,cy-8,6,0,Math.PI*2); ctx.fill();
        ctx.strokeStyle="#111"; ctx.lineWidth=6; ctx.beginPath(); ctx.moveTo(cx-40,cy-42); ctx.lineTo(cx+28,cy-26); ctx.stroke();
        ctx.fillStyle="#1e272e"; ctx.beginPath(); ctx.arc(cx,cy+38,24,0,Math.PI); ctx.fill();

    } else if (currentLevel === 3) {
        ctx.shadowBlur=28; ctx.shadowColor=boss.phase===1?"#be2edd":"#ff4757";
        ctx.fillStyle=boss.color; ctx.strokeStyle="#fff"; ctx.lineWidth=4;
        ctx.beginPath(); ctx.moveTo(cx-bw/2,by); ctx.lineTo(cx+bw/2,by); ctx.lineTo(cx,by+bh); ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.shadowBlur=0;
        const pulse=Math.abs(Math.sin(frames*0.18))*14+8;
        ctx.fillStyle=boss.phase===1?"#e056fd":"#ff4757"; ctx.shadowBlur=16; ctx.shadowColor=ctx.fillStyle;
        ctx.beginPath(); ctx.arc(cx,cy+12,pulse,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
        ctx.strokeStyle=boss.phase===1?"#be2edd":"#ff4757"; ctx.lineWidth=8;
        ctx.beginPath(); ctx.moveTo(cx-45,by+65); ctx.lineTo(cx-16,by+78); ctx.moveTo(cx+45,by+65); ctx.lineTo(cx+16,by+78); ctx.stroke();

    } else if (currentLevel === 4) {
        const wingFlap = Math.sin(frames * 0.1) * 18;
        const glowCol = boss.phase === 1 ? "#8b0000" : "#ff1a00";
        ctx.shadowBlur = boss.phase === 2 ? 35 : 18;
        ctx.shadowColor = glowCol;

        // Wings (extend right)
        ctx.fillStyle = boss.phase === 1 ? "#2a0505" : "#520808";
        ctx.strokeStyle = boss.phase === 1 ? "#5a0000" : "#8b0000"; ctx.lineWidth = 2;
        // Upper wing
        ctx.beginPath();
        ctx.moveTo(bx+bw-8, by+50);
        ctx.lineTo(bx+bw+52, by+5-wingFlap);
        ctx.lineTo(bx+bw+58, by+90);
        ctx.lineTo(bx+bw+8,  by+100);
        ctx.closePath(); ctx.fill(); ctx.stroke();
        // Lower wing
        ctx.beginPath();
        ctx.moveTo(bx+bw-8,  by+100);
        ctx.lineTo(bx+bw+50, by+130);
        ctx.lineTo(bx+bw+28, by+175);
        ctx.lineTo(bx+bw+5,  by+155);
        ctx.closePath(); ctx.fill(); ctx.stroke();
        // Wing membranes
        ctx.strokeStyle = "rgba(160,0,0,0.35)"; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(bx+bw-5,by+65); ctx.lineTo(bx+bw+52,by+5-wingFlap); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(bx+bw-5,by+80); ctx.lineTo(bx+bw+58,by+90); ctx.stroke();

        ctx.shadowBlur = 0;

        // Body
        ctx.fillStyle = boss.color; ctx.strokeStyle = "#1a0000"; ctx.lineWidth = 4;
        rr(bx+12, by+38, bw-24, bh-80, 18, boss.color, "#1a0000", 4);

        // Horns
        ctx.fillStyle = "#1a0000"; ctx.strokeStyle = "#333"; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(cx-28,by+42); ctx.lineTo(cx-48,by-22); ctx.lineTo(cx-12,by+48); ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(cx+28,by+42); ctx.lineTo(cx+48,by-22); ctx.lineTo(cx+12,by+48); ctx.closePath(); ctx.fill(); ctx.stroke();

        // Tail
        ctx.strokeStyle = boss.phase===1?"#6d0000":"#cc1100"; ctx.lineWidth=7; ctx.lineCap="round";
        ctx.shadowBlur=8; ctx.shadowColor=boss.color;
        ctx.beginPath(); ctx.moveTo(cx+12,by+bh-20); ctx.quadraticCurveTo(cx+48,by+bh+20,cx+32,by+bh+48); ctx.stroke();
        ctx.shadowBlur=0;
        // Tail diamond tip
        ctx.fillStyle=boss.phase===1?"#8b0000":"#ff1a00";
        ctx.beginPath(); ctx.moveTo(cx+32,by+bh+36); ctx.lineTo(cx+43,by+bh+50); ctx.lineTo(cx+32,by+bh+64); ctx.lineTo(cx+21,by+bh+50); ctx.closePath(); ctx.fill();

        ctx.shadowBlur = 0;

        // Eyes
        const eyeY = by + 75;
        const eyeCol = boss.phase===1?"#ff6600":"#ff1111";
        ctx.shadowBlur=14; ctx.shadowColor=eyeCol; ctx.fillStyle=eyeCol;
        ctx.beginPath(); ctx.ellipse(cx-22,eyeY,17,13,0,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(cx+22,eyeY,17,13,0,0,Math.PI*2); ctx.fill();
        ctx.shadowBlur=0;
        // Vertical slit pupils
        ctx.fillStyle="#000";
        ctx.beginPath(); ctx.ellipse(cx-22,eyeY,6,12,0,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(cx+22,eyeY,6,12,0,0,Math.PI*2); ctx.fill();
        // Angry brows
        ctx.strokeStyle="#1a0000"; ctx.lineWidth=5; ctx.lineCap="round";
        ctx.beginPath(); ctx.moveTo(cx-40,eyeY-15); ctx.lineTo(cx-6,eyeY-6); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(cx+40,eyeY-15); ctx.lineTo(cx+6,eyeY-6); ctx.stroke();

        // Mouth
        ctx.fillStyle="#0d0000";
        ctx.beginPath(); ctx.arc(cx,by+115,27,0.18,Math.PI-0.18); ctx.fill();
        // Fangs
        ctx.fillStyle="#f0f0f0";
        for (const [fx] of [[-18],[-4],[10]]) {
            ctx.beginPath(); ctx.moveTo(cx+fx,by+115); ctx.lineTo(cx+fx+6,by+134); ctx.lineTo(cx+fx+12,by+115); ctx.closePath(); ctx.fill();
        }
    }
    ctx.restore();
}

// ─────────────────────────────────────────────
//  DRAW ENEMIES
// ─────────────────────────────────────────────
function drawEnemy(e) {
    ctx.save();
    if (e.type === "flying") {
        ctx.fillStyle="#27ae60"; ctx.strokeStyle="#1e8449"; ctx.lineWidth=2;
        ctx.beginPath(); ctx.arc(e.x+e.w/2,e.y+e.h/2,e.w/2,0,Math.PI*2); ctx.fill(); ctx.stroke();
        const flap=Math.sin(frames*0.22+e.phase)*7;
        ctx.fillStyle="rgba(39,174,96,0.45)";
        ctx.beginPath(); ctx.ellipse(e.x+e.w/2-e.w/2-7,e.y+e.h/2-flap,e.w/3,e.h/5,-0.3,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(e.x+e.w/2+e.w/2+7,e.y+e.h/2-flap,e.w/3,e.h/5,0.3,0,Math.PI*2); ctx.fill();
        ctx.fillStyle="#fff"; ctx.beginPath(); ctx.arc(e.x+e.w/2,e.y+e.h/2-4,e.w/5,0,Math.PI*2); ctx.fill();
        ctx.fillStyle="#c0392b"; ctx.beginPath(); ctx.arc(e.x+e.w/2+2,e.y+e.h/2-4,e.w/10,0,Math.PI*2); ctx.fill();
    } else {
        ctx.fillStyle="#8e44ad"; ctx.fillRect(e.x+4,e.y+10,e.w-8,e.h-10);
        ctx.fillStyle="#6c3483";
        for(let s=0;s<4;s++){const sx=e.x+4+s*((e.w-8)/3);ctx.beginPath();ctx.moveTo(sx,e.y+10);ctx.lineTo(sx+6,e.y-6);ctx.lineTo(sx+12,e.y+10);ctx.closePath();ctx.fill();}
        ctx.fillStyle="#fff"; ctx.fillRect(e.x+e.w/2-10,e.y+14,8,8); ctx.fillRect(e.x+e.w/2+2,e.y+14,8,8);
        ctx.fillStyle="#e74c3c"; ctx.fillRect(e.x+e.w/2-7,e.y+17,4,4); ctx.fillRect(e.x+e.w/2+5,e.y+17,4,4);
        ctx.fillStyle="#333"; ctx.fillRect(e.x+e.w/2-6,e.y+28,14,4);
    }
    ctx.restore();
}

// ─────────────────────────────────────────────
//  DRAW HUD
// ─────────────────────────────────────────────
function drawHUD() {
    // Left panel
    rr(10, 8, 212, 108, 6, "rgba(0,0,0,0.45)");
    ctx.fillStyle="#ecf0f1"; ctx.font="bold 16px 'Courier New'";
    ctx.fillText(`SCORE  ${score}`, 22, 30);
    ctx.fillText(`NIVEL  ${currentLevel} / ${MAX_LEVELS}`, 22, 52);
    const wCol = player.weapon===1?"#00edff":"#f1c40f";
    ctx.fillStyle=wCol; ctx.font="11px 'Courier New'";
    ctx.fillText(`[F] ${player.weapon===1?"PEASHOOTER":"SPREAD SHOT"}`, 22, 70);

    ctx.fillStyle="#555"; ctx.font="10px 'Courier New'"; ctx.fillText("DASH",22,86);
    rr(56, 76, 100, 8, 3, "#222");
    if (!player.dashCooldown && !player.dashing) rr(56,76,100,8,3,"#3498db");
    else if (player.dashCooldown) { const pct=1-(player.dashCooldownEnd-Date.now())/400; rr(56,76,Math.max(0,100*Math.min(1,pct)),8,3,"#3498db"); }

    ctx.fillStyle="#888"; ctx.font="11px 'Courier New'"; ctx.fillText("HP",22,104);
    for(let i=0;i<player.hpMax;i++){
        const hx=50+i*24, hy=90;
        ctx.fillStyle=i<player.hp?"#e84118":"#3d3d3d";
        ctx.beginPath(); ctx.arc(hx+4,hy+4,6,Math.PI,0,false); ctx.arc(hx+14,hy+4,6,Math.PI,0,false); ctx.lineTo(hx+9,hy+20); ctx.closePath(); ctx.fill();
    }

    // Boss bar
    const bw=400, bh=22, bx=(W-bw)/2, by2=12;
    rr(bx-3,by2-3,bw+6,bh+6,5,"rgba(0,0,0,0.55)");
    rr(bx,by2,bw,bh,3,"#1a1a1a");
    const pct=Math.max(0,boss.hp/boss.hpMax);
    const barCol=boss.phase===1?"#f1c40f":"#e74c3c";
    if(pct>0){ ctx.shadowBlur=8;ctx.shadowColor=barCol; rr(bx,by2,bw*pct,bh,3,barCol); ctx.shadowBlur=0; }
    ctx.strokeStyle="#aaa"; ctx.lineWidth=1.5; ctx.strokeRect(bx,by2,bw,bh);
    ctx.strokeStyle="rgba(255,255,255,0.35)"; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(bx+bw/2,by2); ctx.lineTo(bx+bw/2,by2+bh); ctx.stroke();
    ctx.fillStyle="#fff"; ctx.font="bold 12px 'Courier New'"; ctx.textAlign="center";
    ctx.fillText(`${boss.name}${boss.phase===2?"  ★ FURIOSO":""}`,W/2,by2-4);
    ctx.textAlign="left";

    // Fullscreen toggle icon (top-right)
    const isFs = !!document.fullscreenElement;
    const fHov = hits(FS_BTN, mouse.x, mouse.y);
    rr(FS_BTN.x, FS_BTN.y, FS_BTN.w, FS_BTN.h, 4, fHov?"rgba(255,255,255,0.18)":"rgba(0,0,0,0.45)", fHov?"#ccc":"#555", 1);
    ctx.fillStyle = fHov ? "#fff" : "#888";
    ctx.font = "14px 'Courier New'"; ctx.textAlign = "center";
    ctx.fillText(isFs ? "⊠" : "⛶", FS_BTN.x + FS_BTN.w/2, FS_BTN.y + FS_BTN.h/2 + 5);
    ctx.textAlign = "left";
}

// ─────────────────────────────────────────────
//  DRAW MENU
// ─────────────────────────────────────────────
function drawMenu() {
    ctx.fillStyle="#130906"; ctx.fillRect(0,0,W,H);
    ctx.strokeStyle="rgba(211,84,0,0.07)"; ctx.lineWidth=1;
    for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
    for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
    for(const p of menuParts){
        p.x+=p.vx;p.y+=p.vy;if(p.alpha<1)p.alpha=Math.min(1,p.alpha+0.008);
        if(p.y<0){p.y=H+5;p.x=Math.random()*W;p.alpha=0;}
        ctx.globalAlpha=p.alpha*0.55;
        ctx.fillStyle=Math.random()>0.97?"#f1c40f":"#d35400";
        ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;

    ctx.textAlign="center";
    ctx.font="bold 52px Impact"; ctx.shadowBlur=22; ctx.shadowColor="#d35400"; ctx.fillStyle="#f1c40f";
    ctx.fillText("CUPHEAD: BLOCK EDITION",W/2,72); ctx.shadowBlur=0;
    ctx.strokeStyle="#d35400"; ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(180,92);ctx.lineTo(720,92);ctx.stroke();
    ctx.fillStyle="#95a5a6"; ctx.font="13px 'Courier New'";
    ctx.fillText("ELIGE TU BATALLA",W/2,110);

    for(const btn of MENU_BTNS){
        const hov=hits(btn,mouse.x,mouse.y);
        drawBtn(btn,hov);
        rr(btn.x+btn.w-78,btn.y+10,70,24,4,btn.bColor);
        ctx.fillStyle="#fff"; ctx.font="bold 10px 'Courier New'";
        ctx.fillText(btn.badge,btn.x+btn.w-43,btn.y+26);
    }

    ctx.fillStyle="#3d3d3d"; ctx.font="11px 'Courier New'";
    ctx.fillText("Presiona R en cualquier momento para volver al menú",W/2,418);
    ctx.textAlign="left";
}

// ─────────────────────────────────────────────
//  DRAW GAME SCENE
// ─────────────────────────────────────────────
function drawGame() {
    const skies = {1:["#1a0e08","#3a2518"],2:["#081810","#132b1a"],3:["#17091f","#2b1435"],4:["#120003","#260008"]};
    const [c1,c2]=skies[currentLevel];
    const sky=ctx.createLinearGradient(0,0,0,H); sky.addColorStop(0,c1); sky.addColorStop(1,c2);
    ctx.fillStyle=sky; ctx.fillRect(0,0,W,H);

    if(currentLevel===3){
        ctx.fillStyle="rgba(255,255,255,0.5)";
        for(let i=0;i<40;i++){const sx=((i*137+50)%W),sy=((i*73+30)%(H-60)),br=Math.abs(Math.sin(frames*0.02+i))*0.6+0.2;ctx.globalAlpha=br;ctx.fillRect(sx,sy,2,2);}
        ctx.globalAlpha=1;
    }
    // Level 4: hell embers
    if(currentLevel===4){
        for(let i=0;i<20;i++){const ex=((frames*0.8+i*47)%W),ey=H-40-((frames*1.2+i*61)%(H-80));ctx.globalAlpha=0.4*Math.abs(Math.sin(frames*0.04+i));ctx.fillStyle=i%2===0?"#ff4400":"#ff8800";ctx.beginPath();ctx.arc(ex,ey,2,0,Math.PI*2);ctx.fill();}
        ctx.globalAlpha=1;
    }

    ctx.fillStyle="#16202a"; ctx.fillRect(0,H-40,W,40);
    ctx.fillStyle="#1e2f3d"; ctx.fillRect(0,H-44,W,5);
    ctx.fillStyle="rgba(255,255,255,0.03)";
    for(let x=0;x<W;x+=30)ctx.fillRect(x,H-40,15,40);

    for(const b of bullets){ctx.save();if(b.type===1){ctx.shadowBlur=8;ctx.shadowColor=b.color;ctx.fillStyle=b.color;ctx.beginPath();ctx.ellipse(b.x+b.w/2,b.y+b.h/2,b.w/2,b.h/2,0,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle="#fff";ctx.beginPath();ctx.ellipse(b.x+b.w/2,b.y+b.h/2,b.w/4,b.h/4,0,0,Math.PI*2);ctx.fill();}else{ctx.shadowBlur=6;ctx.shadowColor=b.color;ctx.fillStyle=b.color;ctx.beginPath();ctx.moveTo(b.x+b.w/2,b.y);ctx.lineTo(b.x+b.w,b.y+b.h/2);ctx.lineTo(b.x+b.w/2,b.y+b.h);ctx.lineTo(b.x,b.y+b.h/2);ctx.closePath();ctx.fill();ctx.shadowBlur=0;}ctx.restore();}

    for(const b of bossBullets){ctx.save();if(b.homing){ctx.shadowBlur=14;ctx.shadowColor="#ff8c00";}else{ctx.shadowBlur=8;ctx.shadowColor=b.color;}ctx.fillStyle=b.color;ctx.beginPath();ctx.arc(b.x+b.w/2,b.y+b.h/2,b.w/2,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(b.x+b.w/2,b.y+b.h/2,b.w/4,0,Math.PI*2);ctx.fill();ctx.restore();}

    for(const e of enemies)drawEnemy(e);
    drawPlayer(); drawBoss();

    for(const p of particles){ctx.save();ctx.globalAlpha=p.alpha;ctx.shadowBlur=4;ctx.shadowColor=p.color;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();ctx.restore();}

    drawHUD();
}

// ─────────────────────────────────────────────
//  OVERLAYS
// ─────────────────────────────────────────────
function drawPauseOverlay(){
    ctx.fillStyle="rgba(0,0,0,0.62)";ctx.fillRect(0,0,W,H);
    ctx.textAlign="center";ctx.font="bold 52px 'Courier New'";ctx.shadowBlur=14;ctx.shadowColor="#f1c40f";ctx.fillStyle="#f1c40f";
    ctx.fillText("PAUSA",W/2,H/2-45);ctx.shadowBlur=0;
    for(const btn of getPauseBtns())drawBtn(btn,hits(btn,mouse.x,mouse.y));
    ctx.textAlign="left";
}
function drawDeadOverlay(){
    ctx.fillStyle="rgba(0,0,0,0.85)";ctx.fillRect(0,0,W,H);
    ctx.textAlign="center";ctx.font="72px Impact";ctx.shadowBlur=24;ctx.shadowColor="#e74c3c";ctx.fillStyle="#e74c3c";
    ctx.fillText("YOU DIED",W/2,H/2-10);ctx.shadowBlur=0;
    ctx.fillStyle="#7f8c8d";ctx.font="15px 'Courier New'";ctx.fillText(`Score: ${score}`,W/2,H/2+22);
    for(const btn of getDeadBtns())drawBtn(btn,hits(btn,mouse.x,mouse.y));
    ctx.textAlign="left";
}
function drawVictoryOverlay(){
    ctx.fillStyle="rgba(0,0,0,0.92)";ctx.fillRect(0,0,W,H);
    ctx.save();ctx.translate(W/2,H/2-65);ctx.strokeStyle="#f1c40f";ctx.lineWidth=2;
    for(let i=0;i<12;i++){const a=frames*0.01+i*Math.PI*2/12,len=30+Math.abs(Math.sin(frames*0.05+i))*20;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(a)*len,Math.sin(a)*len);ctx.stroke();}
    ctx.restore();
    ctx.textAlign="center";ctx.font="bold 52px Impact";ctx.shadowBlur=22;ctx.shadowColor="#f1c40f";ctx.fillStyle="#f1c40f";
    ctx.fillText("¡CAMPAÑA COMPLETADA!",W/2,-22+H/2);ctx.shadowBlur=0;
    ctx.fillStyle="#2ecc71";ctx.font="22px 'Courier New'";ctx.fillText(`SCORE FINAL: ${score}`,W/2,H/2+22);
    ctx.fillStyle="#7f8c8d";ctx.font="13px 'Courier New'";ctx.fillText("Click o R para volver al menú",W/2,H/2+56);
    ctx.textAlign="left";
}
function drawTransitionOverlay(){
    ctx.fillStyle="#080808";ctx.fillRect(0,0,W,H);
    ctx.textAlign="center";ctx.font="66px Impact";ctx.shadowBlur=18;ctx.shadowColor="#f1c40f";ctx.fillStyle="#f1c40f";
    ctx.fillText("¡KNOCKOUT!",W/2,H/2-18);ctx.shadowBlur=0;
    ctx.fillStyle="#ecf0f1";ctx.font="20px 'Courier New'";ctx.fillText(`Preparando Nivel ${currentLevel}...`,W/2,H/2+38);
    ctx.textAlign="left";
}

// ─────────────────────────────────────────────
//  MAIN LOOP
// ─────────────────────────────────────────────
function draw(){
    ctx.save();
    if(shakeFrames>0&&shakeAmt>0.5)ctx.translate((Math.random()-0.5)*shakeAmt*2,(Math.random()-0.5)*shakeAmt*2);
    switch(gameState){
        case"MENU":       drawMenu();break;
        case"PLAYING":    drawGame();break;
        case"PAUSED":     drawGame();drawPauseOverlay();break;
        case"DEAD":       drawGame();drawDeadOverlay();break;
        case"VICTORY":    drawVictoryOverlay();break;
        case"TRANSITION": drawTransitionOverlay();break;
    }
    ctx.restore();
}
function loop(){update();draw();requestAnimationFrame(loop);}
loop();
</script>
</body>
